# knurgN actions: what happens when a tag is tapped. Copy to knurgn.properties next to
# knurd.properties (git ignores that name) and add actions.file=knurgn.properties to knurd.properties.
#
# Only taps that knurd has verified and never seen before reach knurgN. The tap link can't choose
# or change the action: knurgN picks it from the rules below by the tag's verified UID.

# Knots: one block per tag, by UID (14 hex digits; knurctl info shows it).
# name: what the tag is called in webhooks and logs. actions: comma-separated connector ids.
knot.04DE5F1EACC040.name=desk-candle
knot.04DE5F1EACC040.actions=desk-webhook

# Webhook connectors: each verified tap sends a signed JSON POST to this address.
# Must be https://, except for localhost or a private network address (192.168.x.x, 10.x.x.x...).
webhook.desk-webhook.url=http://127.0.0.1:8425/knura

# Webhook secrets live in their own file that only you can read, never in this one:
#   (umask 077; printf 'desk-webhook=whsec_%s\n' "$(openssl rand -base64 32)" > knurgn-secrets.properties)
# knurd refuses to start if other users can read it. Relative to this file's folder.
secrets.file=knurgn-secrets.properties

# Matter bridge (knurgn-matter): shows knots as contact sensors in Apple Home, Google Home, Alexa
# and SmartThings. Run knurgn-matter on this computer, add "home" to a knot's actions, and put the
# same whsec_ secret in knurgn-secrets.properties (home=whsec_...) and in knurgn-matter-secret.
# See knurgn-matter/README.md.
#matter.home.url=http://127.0.0.1:5541/tap

# Home Assistant: starts an automation through its webhook trigger, no login token needed.
# The address is Home Assistant's own (use its IP address for http://). Put the automation's
# webhook id in knurgn-secrets.properties (living-room=<id>); make one with: openssl rand -hex 24
# See docs/home-assistant.md.
#homeassistant.living-room.url=http://192.168.1.50:8123
