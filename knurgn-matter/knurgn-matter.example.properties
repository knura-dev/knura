# knurgn-matter: shows knots as contact sensors in Apple Home, Google Home, Alexa and SmartThings.
# Copy to knurgn-matter.properties (git ignores that name).

# The knots to show, by the names used in knurgn.properties (knot.<UID>.name). Each one becomes a
# contact sensor that "opens" for a few seconds when its tag is tapped.
knots=desk-candle

# The name each sensor shows in your app (up to 32 characters). Optional; the knot name otherwise.
knot.desk-candle.label=Desk candle

# How long a sensor stays open after a tap. Taps closer together than this count as one.
pulse.seconds=3

# knurgN posts taps to http://127.0.0.1:<listen.port>/tap. Only this computer can reach it.
listen.port=5541
# The Matter port smart-home hubs talk to on your home network (UDP).
matter.port=5540

# Where the bridge keeps its pairing code and the keys from the apps it is paired with. Keep it
# private and back it up: deleting it unpairs the bridge everywhere.
storage.dir=knurgn-matter-storage

# The shared secret knurgN signs taps with (whsec_...), alone in a file only you can read. The same
# value goes in knurgn-secrets.properties. The bridge refuses to start if others can read it.
secret.file=knurgn-matter-secret
