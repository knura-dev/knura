name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Java build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew build

  node:
    name: Node tests (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        dir: [knurgn-matter, knura-resolver]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test

  kubernetes:
    name: Helm chart on kind
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Tool versions
        run: |
          kind version
          kubectl version --client
          helm version
      - run: helm lint deploy/helm/knura
      - name: Install the chart on kind and tap
        run: deploy/kind/test.sh
      - name: Show the pod on failure
        if: failure()
        run: |
          kubectl --namespace knura-test get all,pvc,events || true
          kubectl --namespace knura-test describe pods || true
          kubectl --namespace knura-test logs deployment/knura --all-containers --prefix || true
