name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Java build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew build

  android:
    name: Android app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # The runner image has the Android SDK; the Gradle plugin fetches the platform it needs.
      - run: ./gradlew -p android testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: knura-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  node:
    name: Node tests (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        dir: [knurgn-matter, knura-resolver]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test

  kubernetes:
    name: Helm chart on kind
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Tool versions
        run: |
          kind version
          kubectl version --client
          helm version
      - run: helm lint deploy/helm/knura
      - name: Install the chart on kind and tap
        run: |
          # Stand-in for someone's own cluster (minikube...): the test must leave it current.
          kubectl config set-context my-own-cluster --cluster=my-own-cluster
          kubectl config use-context my-own-cluster
          deploy/kind/test.sh
          test "$(kubectl config current-context)" = my-own-cluster
      - name: Show the pod on failure
        if: failure()
        run: |
          kubectl --context kind-knura-test --namespace knura-test get all,pvc,events || true
          kubectl --context kind-knura-test --namespace knura-test describe pods || true
          kubectl --context kind-knura-test --namespace knura-test logs deployment/knura --all-containers --prefix || true
