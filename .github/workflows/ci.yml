name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Java build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew build

  android:
    name: Android app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # The runner image has the Android SDK; the Gradle plugin fetches the platform it needs.
      - run: ./gradlew -p android testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: knura-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  node:
    name: Node tests (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        dir: [knurgn-matter, knura-resolver]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test

  kubernetes:
    name: Helm chart on kind
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Tool versions
        run: |
          kind version
          kubectl version --client
          helm version
      - run: helm lint deploy/helm/knura
      - name: Install the chart on kind and tap
        run: |
          # Stand-in for someone's own cluster (minikube...): the test must leave it current.
          kubectl config set-context my-own-cluster --cluster=my-own-cluster
          kubectl config use-context my-own-cluster
          deploy/kind/test.sh
          test "$(kubectl config current-context)" = my-own-cluster
      - name: Show the pod on failure
        if: failure()
        run: |
          kubectl --context kind-knura-test --namespace knura-test get all,pvc,events || true
          kubectl --context kind-knura-test --namespace knura-test describe pods || true
          kubectl --context kind-knura-test --namespace knura-test logs deployment/knura --all-containers --prefix || true
