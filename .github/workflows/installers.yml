name: Installers

# Builds Knura's installers, Java included, with jpackage on each system: .deb (x86-64 and ARM64,
# for Ubuntu, Debian and Raspberry Pi OS 64-bit), .rpm (Fedora) and .msi (Windows). The .pkg (Mac
# with Apple silicon) is paused and only built when started by hand with "mac" ticked. On a version tag they are attached to that GitHub Release; otherwise they are
# kept as this run's artifacts for a week. See packaging/build-installer.sh.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/installers.yml"
      - "knurd/src/main/java/io/knura/knurd/Desktop.java"
      - "knurd/src/main/java/io/knura/knurd/FirstRun.java"
  workflow_dispatch:
    inputs:
      mac:
        description: Include the Mac package (paused until GitHub gives this account a Mac runner)
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # The Mac package is paused: GitHub hasn't given this account a Mac runner yet. Start this
        # workflow by hand with "Include the Mac package" ticked to try it.
        include: ${{ fromJSON(inputs.mac && '[{"os":"ubuntu-24.04","types":"deb rpm"},{"os":"ubuntu-24.04-arm","types":"deb"},{"os":"windows-2022","types":"msi"},{"os":"macos-15","types":"pkg"}]' || '[{"os":"ubuntu-24.04","types":"deb rpm"},{"os":"ubuntu-24.04-arm","types":"deb"},{"os":"windows-2022","types":"msi"}]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Tools jpackage needs
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q fakeroot rpm ;;
            Windows) command -v candle.exe >/dev/null || choco install wixtoolset --version 3.14.1 -y --no-progress ;;
          esac
      - name: Build
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export PATH="$PATH:/c/Program Files (x86)/WiX Toolset v3.14/bin"; fi
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) version="0.0.0-dev" ;; esac
          mkdir -p dist
          for type in ${{ matrix.types }}; do
            packaging/build-installer.sh "$version" "$type"
            cp build/installer/out/* dist/
          done
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          path: dist/*
          retention-days: 7
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: "dist/*"
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Release workflow makes the release; wait for it.
          for i in $(seq 1 60); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 20
          done
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
