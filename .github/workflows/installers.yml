name: Installers

# Builds Knura's installers, Java included, with jpackage on each system: .deb (x86-64 and ARM64,
# for Ubuntu, Debian and Raspberry Pi OS 64-bit), .rpm (Fedora), .msi (Windows) and .pkg (Mac with
# Apple silicon). On a version tag they are attached to that GitHub Release; otherwise they are
# kept as this run's artifacts for a week. See packaging/build-installer.sh.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/installers.yml"
      - "knurd/src/main/java/io/knura/knurd/Desktop.java"
      - "knurd/src/main/java/io/knura/knurd/FirstRun.java"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, types: "deb rpm" }
          - { os: ubuntu-24.04-arm, types: "deb" }
          - { os: windows-2022, types: "msi" }
          - { os: macos-15, types: "pkg" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Tools jpackage needs
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q fakeroot rpm ;;
            Windows) command -v candle.exe >/dev/null || choco install wixtoolset --version 3.14.1 -y --no-progress ;;
          esac
      - name: Build
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export PATH="$PATH:/c/Program Files (x86)/WiX Toolset v3.14/bin"; fi
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) version="0.0.0-dev" ;; esac
          mkdir -p dist
          for type in ${{ matrix.types }}; do
            packaging/build-installer.sh "$version" "$type"
            cp build/installer/out/* dist/
          done
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.os }}
          path: dist/*
          retention-days: 7
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: "dist/*"
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Release workflow makes the release; wait for it.
          for i in $(seq 1 60); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 20
          done
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
