name: Release

# Push a tag like v0.1.0-alpha, or publish a release with a new tag on GitHub, to build knurctl,
# knurd and knura-link and attach their zips, and the Android app, to that GitHub Release, with a
# SHA256SUMS file and a signed build provenance record (check one with `gh attestation verify FILE
# -R knura-dev/knura`). The app is signed with Knura's release key when the ANDROID_KEYSTORE secrets
# are set, otherwise it is a test build signed with a fresh debug key, like android-latest.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # signs the build provenance
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build and test
        run: ./gradlew build :knurctl:distZip :knurd:distZip :knura-link:distZip -Pversion="${GITHUB_REF_NAME#v}"
      - name: Build the Android app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
          KNURA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KNURA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KNURA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: .github/scripts/build-android.sh "knura-${GITHUB_REF_NAME#v}.apk"
      - name: Collect the files and their checksums
        run: |
          mkdir dist
          cp knurctl/build/distributions/*.zip knurd/build/distributions/*.zip knura-link/build/distributions/*.zip knura-*.apk dist/
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="dist/*"
          # A release drafted on GitHub's website already exists: just attach the files to it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            prerelease=""
            case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" $prerelease --generate-notes $files
          fi
