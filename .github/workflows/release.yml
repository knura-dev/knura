name: Release

# Push a tag like v0.1.0-alpha, or publish a release with a new tag on GitHub, to build knurctl
# and knurd and attach their zips to that GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build and test
        run: ./gradlew build :knurctl:distZip :knurd:distZip -Pversion="${GITHUB_REF_NAME#v}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="knurctl/build/distributions/*.zip knurd/build/distributions/*.zip"
          # A release drafted on GitHub's website already exists: just attach the files to it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            prerelease=""
            case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" $prerelease --generate-notes $files
          fi
