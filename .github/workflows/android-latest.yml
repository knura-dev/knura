name: Android app download

# Keeps a plain download link to the newest Knura app for phones:
# https://github.com/knura-dev/knura/releases/download/android-latest/knura.apk
# It is a pre-release named android-latest, rebuilt whenever the app changes on main, with a
# knura.apk.sha256 checksum. Once the ANDROID_KEYSTORE secrets are set, every build is signed with
# Knura's release key and installs over the last one; until then each is signed with a fresh debug
# key, so uninstall the old app before installing a newer one.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-latest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-latest
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build the app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
          KNURA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KNURA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KNURA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: .github/scripts/build-android.sh knura.apk
      - name: Replace the android-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum knura.apk > knura.apk.sha256
          if [ -f signed-with-release-key ]; then
            SIGNED="Signed with the Knura release key, so it installs over an earlier release-signed app."
          else
            SIGNED="Uninstall the old app before installing this one: each test build is signed with a new debug key."
          fi
          # Recreated each time so its tag points at the commit the app was built from.
          gh release delete android-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create android-latest knura.apk knura.apk.sha256 --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "Knura Android app (test build)" \
            --notes "Newest test build of the Knura app, from ${GITHUB_SHA::7}. Setup: docs/android-app.md. Check it against knura.apk.sha256. $SIGNED"
