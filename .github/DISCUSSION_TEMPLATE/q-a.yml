title: "[Question] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for asking! Search existing discussions first, your answer may already be here.
        Never paste a master.key, tag keys, admin tokens or webhook secrets.
        Found a security problem? Report it privately instead, see SECURITY.md.
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: What you expected to happen, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Knura version
      description: For example v0.3.0-alpha, or "built from main".
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      multiple: true
      options:
        - knurctl (tag setup)
        - knurd (tap verification)
        - knurgN actions (webhooks, Matter, Home Assistant)
        - tap.knura.io resolver
        - Android app
        - Kubernetes / Helm
        - Not sure
  - type: input
    id: setup
    attributes:
      label: Your setup
      description: Operating system, NFC reader and phone, if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs or command output
      description: Remove any keys, tokens or secrets first.
      render: text
