# knurd configuration. Copy to knurd.properties (git ignores that name) and set your own keys.
#
# The keys below are NXP's all-zero example keys from AN12196. They are public, so anything
# protected by them is not protected at all. Use them only to try knurd out.

# Where knurd listens. 127.0.0.1 accepts local requests only, which is what you want behind a
# tunnel or reverse proxy on the same computer. 0.0.0.0 listens on every network interface.
listen.host=127.0.0.1
listen.port=8424

# Logging. Messages always go to the terminal (or the systemd journal). log.level picks how much:
# error, warn, info (the default), debug (each action attempt, with timings) or trace. The
# environment variable KNURA_LOG_LEVEL overrides it for one run. log.file also writes the log to a
# file, relative to this file's folder; at 10 MB it moves to knurd.log.1 and 4 old files are kept.
# Keys, tokens, claim codes and tap link MACs are never logged. See docs/logs.md.
#log.level=info
#log.file=logs/knurd.log

# The HTTPS address phones use to reach knurd, without /tap. knurctl provision writes
# <public.url>/tap onto tags. Phones can't reach 127.0.0.1, so put an HTTPS tunnel in front of
# knurd, such as Tailscale Funnel (`sudo tailscale funnel --bg 8424`), and set its address here.
# Only /tap, /health and /.well-known/knura-owner are served on this port, all safe to expose.
#public.url=https://your-computer.your-tailnet.ts.net

# Tap resolver (tap.knura.io). 'knurctl resolver register' adds these; don't write them by hand.
# Tags then carry <resolver.url>/<resolver.owner> and the resolver forwards taps to public.url.
# knurd tells the resolver its owner ID at /.well-known/knura-owner and checks every 6 hours that
# the resolver still sends taps here. resolver.key is secret: whoever has it can move your taps.
#resolver.url=https://tap.knura.io
#resolver.owner=
#resolver.publicKey=
#resolver.key=

# Keys: either one master key, or fixed SDM keys (below). Not both.
#
# master.key: knurd works out each tag's own keys from this key and the tag's UID (NXP AN10922
# diversification). Tags must have been set up with the same master key. With master.key set,
# leave sdm.metaReadKey and sdm.fileReadKey unset; sdm.fileReadKey.<UID> still overrides one tag.
# The value below is NXP's public AN10922 example key, for trying knurd out only.
#master.key=00112233445566778899AABBCCDDEEFF
#
# master.key.file: the same key, alone in its own file, instead of master.key. This is how a
# Kubernetes or Docker secret hands the key to knurd. Only knurd's user may read the file
# (chmod 600); knurd refuses to start otherwise. Relative to this file's folder.
#master.key.file=master.key

# SDMMetaReadKey: decrypts the e= PICC data. Needed only for encrypted-mirror tags.
sdm.metaReadKey=00000000000000000000000000000000

# SDMFileReadKey shared by all tags...
sdm.fileReadKey=00000000000000000000000000000000
# ...and/or per tag, by UID. A per-tag key wins over the shared one.
#sdm.fileReadKey.04DE5F1EACC040=00000000000000000000000000000000

# Last accepted read counter per tag, for replay protection. Relative to this file's folder.
counters.file=knurd-counters.properties

# What this Knura is called, shown on the setup page and in the app. The setup page sets it.
#knura.name=Our house

# knurgN actions: what a verified tap does. Leave unset for no actions. See
# knurgn/knurgn.example.properties. Relative to this file's folder.
#actions.file=knurgn.properties

# Admin API: a second port for knurctl (and later LoomStudio) to manage knurd. Off unless
# admin.tokens.file or admin.security is set. It is never the tap port and must never be on the
# internet: don't funnel or port-forward it. knurd refuses public addresses and refuses requests
# that came through a proxy or tunnel. Every request, allowed or refused, is written to
# admin.audit.file. Tokens and keys never are.
#
# admin.security picks how knurctl logs in:
#   token      (the default) every request needs a login token, and knurctl reads it from a
#              --creds file. 'knurctl admin token add <name>' makes both and sets admin.tokens.file.
#   plaintext  no login at all: knurctl admin commands work without --creds. Like Kafka's
#              PLAINTEXT listener, it's for this computer only, so knurd then listens on
#              127.0.0.1 and refuses any other admin.listen.host. Anyone with an account on this
#              computer can use the admin API.
#admin.security=token
#admin.tokens.file=knurd-admin-tokens.properties
#admin.audit.file=knurd-admin-audit.log
#
# Where it listens. 127.0.0.1 is this computer only, over plain HTTP. For other computers on your
# network (token mode only), use this computer's LAN or Tailscale address (or 0.0.0.0 in a
# container), and TLS is required: 'knurctl admin tls create' makes the two files below.
#admin.listen.host=127.0.0.1
#admin.listen.port=8425
#admin.tls.keystore=knurd-admin.p12
#admin.tls.password.file=knurd-admin.p12.password
#
# Or keep admin.listen.host=127.0.0.1 and add a second listener for phones on your Wi-Fi: on every
# network, TLS only (with the two files above), while this computer keeps plain HTTP on loopback.
# Pairing a phone on the setup page sets this, and the TLS files, for you.
#admin.lan.port=8426
#
# Setting tags up with a phone's NFC instead of a USB reader (the Knura Android app, docs/android-app.md).
# The phone only passes messages between the tag and knurd: knurd works out the tag's keys from
# master.key and they never reach the phone. Off unless this names at least one admin token
# ('knurctl admin token add <name>'). Needs admin.security=token, master.key and public.url, and
# the phone must reach admin.listen.host, so use this computer's LAN address with TLS. A token
# named here can set up, reset and read any tag held to the phone, so name only your own phones.
#admin.provision.tokens=fold7
#
# The setup page signs in with a password, kept as a hash in knurd-admin-password (chmod 600) next
# to this file. The first one can only be set from this computer. Signed-in browsers and the
# tokens above may change names, tags and actions; see docs/setup-api.md.
