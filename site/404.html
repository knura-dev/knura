<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Knura</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root { --paper: #0A0D12; --ink: #E8EDF3; --muted: #8B97A6; --copper: #F28C3A; color-scheme: dark; }
@media (prefers-color-scheme: light) { :root { --paper: #FFFFFF; --ink: #0B1220; --muted: #5A6675; --copper: #E06B12; color-scheme: light; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding-inline: 20px;
  background: var(--paper); color: var(--ink); font: 400 1rem/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { display: grid; gap: 12px; max-width: 32em; }
p.code { font: 500 0.8rem/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--copper); margin: 0; }
h1 { margin: 0; font-size: 2rem; line-height: 1.1; }
p { margin: 0; color: var(--muted); }
a { color: var(--ink); text-decoration-color: var(--copper); text-underline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>This page doesn't exist.</h1>
  <p>Looking for a tap link? Tags point at their own server, not at knura.io. <a href="/">Go to the Knura home page</a>.</p>
</main>
</body>
</html>
